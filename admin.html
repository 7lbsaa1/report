<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع حلبسة - لوحة إدارة البلاغات</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <header>
    <div class="logo-container">
      <h1 class="logo-title">موقع حلبسة</h1>
      <span class="logo-subtitle">Admin Panel</span>
    </div>
    <div>
      <a href="/" style="color: var(--text-main); text-decoration: none; margin-left: 15px; font-weight: bold;">العودة للموقع</a>
      <button id="themeToggle" class="theme-toggle" style="display: inline-flex;">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <main style="max-width: 1200px;">
    <div class="admin-header">
      <h2 class="page-title">إدارة البلاغات</h2>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">إجمالي البلاغات</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="newCount">0</div>
        <div class="stat-label">جديدة</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="reviewCount">0</div>
        <div class="stat-label">قيد المراجعة</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="resolvedCount">0</div>
        <div class="stat-label">تم الحل</div>
      </div>
    </div>

    <div class="search-box input-wrapper">
      <i class="fas fa-search input-icon" style="right: auto; left: 20px;"></i>
      <input type="text" id="searchInput" class="form-control" placeholder="ابحث بالاسم أو البريد أو رقم الهاتف...">
    </div>

    <div class="reports-grid" id="reportsGrid">
      <!-- يتم جلب الكروت هنا من Firebase -->
    </div>
  </main>

  <!-- Modal لعرض الصور -->
  <div class="modal" id="imageModal">
    <span class="close-modal" id="closeModal">&times;</span>
    <img src="" alt="Full Preview" class="modal-content" id="modalImg">
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
